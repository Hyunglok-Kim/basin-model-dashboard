<style>
:root{--bg:#F4F6F9;--card:#FFFFFF;--ink:#1B2430;--muted:#5F6B7A;--line:#DCE2EA;--navy:#1F3A5F;--red:#B9473B}
@media (prefers-color-scheme: dark){:root{--bg:#0F141B;--card:#171E27;--ink:#E6EBF2;--muted:#9AA7B5;--line:#2A3441;--navy:#A9CBF2;--red:#E07B6F}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 26px;width:100%;max-width:380px}
h1{font-size:19px;margin:0 0 4px;color:var(--navy)}p{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.5}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--navy);outline-offset:1px}
button{width:100%;margin-top:12px;font:inherit;font-size:15px;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--navy);color:var(--card);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--red)}
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
async function show(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function keyFromPw(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
(async () => {   // 같은 탭에서 새로 고침하면 다시 묻지 않는다
  try { const k = sessionStorage.getItem("dash_key"); if (k) { await show(await crypto.subtle.importKey("raw", b64(k), "AES-GCM", true, ["decrypt"])); } }
  catch (e) { try { sessionStorage.removeItem("dash_key") } catch (_) {} }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); const msg = document.getElementById("msg"), go = document.getElementById("go");
  if (!window.crypto || !crypto.subtle) { msg.textContent = "이 브라우저에서는 열 수 없습니다. 크롬, 엣지, 사파리 최신판으로 https 주소에서 열어 주십시오."; return; }
  go.disabled = true; go.textContent = "여는 중…"; msg.textContent = "";
  try { const key = await keyFromPw(document.getElementById("pw").value);
    const raw = await crypto.subtle.exportKey("raw", key);
    await show(key).then(() => { try { sessionStorage.setItem("dash_key", toB64(raw)) } catch (_) {} });
  } catch (err) { msg.textContent = "비밀번호가 맞지 않습니다."; go.disabled = false; go.textContent = "열기"; }
});
